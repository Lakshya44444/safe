<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bin QR Stickers</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Hind:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .qr-page { max-width: 980px; margin: 0 auto; padding: 1.4rem 16px 3rem; }
    .qr-controls { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; margin: 1rem 0 1.5rem; }
    .qr-controls select, .qr-controls button {
      min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 0 .8rem;
    }
    .qr-controls button { background: var(--ink); color: var(--paper); border: 0; cursor: pointer; font-weight: 600; }
    .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
    .sticker {
      background: #fff; color: #1d2b24; border-radius: 14px; padding: .9rem; text-align: center;
      border: 6px solid var(--c); break-inside: avoid;
    }
    .sticker h3 { font-family: var(--display); font-size: 1.5rem; margin: 0; color: var(--c); }
    .sticker .bh { font-weight: 600; margin: .1rem 0 .6rem; }
    .sticker .code { display: grid; place-items: center; min-height: 160px; }
    .sticker .code img, .sticker .code canvas { width: 160px; height: 160px; }
    .sticker p { font-size: .82rem; margin: .5rem 0 0; color: #5b6b63; }
    @media print {
      .top-print, .qr-controls { display: none; }
      body { background: #fff; }
      .sheet { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="qr-page">
    <div class="top-print">
      <h1>Bin QR stickers</h1>
      <p class="sub">Stick each sticker on the bin of the same colour. Scanning it opens the report screen with the Bhawan and bin already filled in, so the worker only takes the photo.</p>
    </div>
    <div class="qr-controls">
      <label>Bhawan <select id="bh"></select></label>
      <button type="button" onclick="print()">Print</button>
      <a href="./">Back to the dashboard</a>
    </div>
    <div class="sheet" id="sheet"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const STREAMS = [
      ["wet", "Wet", "var(--wet)", "food, peels, tea leaves"],
      ["dry", "Dry", "var(--dry)", "plastic, paper, bottles"],
      ["sanitary", "Sanitary", "var(--sanitary)", "diapers, pads"],
      ["special_care", "Special care", "var(--special)", "medicines, bulbs, batteries"],
    ];
    const base = location.href.replace(/qr\.html.*$/, "");
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function render(bhawan) {
      const sheet = document.getElementById("sheet");
      sheet.innerHTML = STREAMS.map(([s, name, c, hint]) => `
        <div class="sticker" style="--c:${c}">
          <h3>${name}</h3>
          <div class="bh">${esc(bhawan)} Bhawan</div>
          <div class="code" data-url="${esc(`${base}?b=${encodeURIComponent(bhawan)}&s=${s}`)}"></div>
          <p>Only ${hint}. Scan, then send a photo.</p>
        </div>`).join("");
      sheet.querySelectorAll(".code").forEach((el) => {
        if (window.QRCode) new QRCode(el, { text: el.dataset.url, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M });
        else el.textContent = el.dataset.url;
      });
    }

    fetch("api/meta").then((r) => r.json()).then((m) => {
      const sel = document.getElementById("bh");
      sel.innerHTML = m.bhawans.map((b) => `<option>${esc(b)}</option>`).join("");
      sel.onchange = () => render(sel.value);
      render(sel.value);
    });
  </script>
</body>
</html>
