# Render Blueprint: the web API + front end on the free plan (no card needed).
# render-full.yaml adds the paid Starter plan and the nightly cron job (needs a card on file;
# hackathon credits cover it). The Workflow service is created from the Dashboard.
services:
  - type: web
    name: kachra-report-card
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install render
    startCommand: python -m scripts.seed_demo_if_empty && uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GRADER_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_FALLBACKS
        value: ""
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: kachra-report-card
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        sync: false
